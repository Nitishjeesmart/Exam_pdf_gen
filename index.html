<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEST GENERATOR APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CORE VARIABLES --- */
        :root { --primary: #6200ea; --bg: #f4f7f6; --text: #2c3e50; --success: #00c853; --danger: #d50000; --wa: #25D366; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #6200ea, #3700b3);
            z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
            transition: opacity 0.8s ease-out;
        }
        .splash-logo { font-size: 80px; margin-bottom: 20px; animation: bounce 2s infinite; text-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .splash-title { font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; animation: slideUp 1s; }
        .splash-sub { font-size: 14px; opacity: 0.8; margin-top: 5px; font-style: italic; }
        @keyframes bounce { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-20px);} }
        @keyframes slideUp { from {opacity:0; transform: translateY(20px);} to {opacity:1; transform: translateY(0);} }

        /* --- RIPPLE EFFECT (Water Touch) --- */
        .ripple { position: absolute; border-radius: 50%; background: rgba(98, 0, 234, 0.3); transform: scale(0); animation: ripple-anim 0.6s linear; pointer-events: none; }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

        /* --- HEADER --- */
        .app-header { background: var(--primary); color: white; padding: 15px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .stats-pill { background: rgba(255,255,255,0.25); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-left: 4px; backdrop-filter: blur(5px); }

        /* --- LAYOUT --- */
        .tab-section { display: none; padding: 15px; animation: fadeUp 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .tab-section.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: white; padding: 18px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.02); }
        h3 { margin: 0 0 15px 0; color: var(--primary); font-size: 17px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }

        /* --- INPUTS --- */
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 15px; background: #fafafa; outline: none; transition: 0.3s; margin-bottom: 10px; }
        input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(98, 0, 234, 0.1); transform: translateY(-1px); }
        label { font-size: 12px; font-weight: 700; color: #546e7a; margin-bottom: 5px; display: block; margin-top: 5px; }

        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .row-check { display: flex; flex-wrap: wrap; gap: 12px; background: #f1f8e9; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
        .check-item { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #33691e; }
        .check-item input { width: 18px; height: 18px; margin: 0; accent-color: var(--success); }

        /* --- BUTTONS --- */
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; color: white; cursor: pointer; background: var(--primary); display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 4px 10px rgba(98, 0, 234, 0.3); }
        .btn:active { transform: scale(0.96); box-shadow: none; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); box-shadow: none; }
        .btn-danger { background: var(--danger); box-shadow: 0 4px 10px rgba(213, 0, 0, 0.3); }
        .btn-copy { background: #fff8e1; color: #f57c00; border: 1px solid #ffe0b2; justify-content: flex-start; margin-bottom: 8px; box-shadow: none; }

        /* --- HISTORY SCROLL & ANIMATION --- */
        #histList { max-height: 600px; overflow-y: auto; padding-right: 2px; }
        /* Marquee for Names */
        .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; background: white; margin-bottom: 8px; border-radius: 10px; border: 1px solid #f5f5f5; }
        .hist-left { width: 65%; overflow: hidden; position: relative; }
        .marquee-wrap { white-space: nowrap; overflow: hidden; }
        .marquee-text { display: inline-block; padding-left: 0; animation: marquee 8s linear infinite; font-weight: bold; color: #37474f; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .hist-meta { font-size: 11px; color: #90a4ae; margin-top: 2px; font-weight: 500; }
        .btn-icon-sm { width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }

        /* --- BOTTOM NAV --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0; z-index: 99; height: 70px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); }
        .nav-item { border: none; background: transparent; color: #b0bec5; display: flex; flex-direction: column; align-items: center; width: 20%; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .nav-icon { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); }

        /* --- MODALS --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(3px); }
        .modal-box { background: white; width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; display: flex; flex-direction: column; max-height: 85vh; overflow-y: auto; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- WHATSAPP --- */
        .wa-float { position: fixed; bottom: 85px; right: 20px; background: var(--wa); color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4); z-index: 1000; text-decoration: none; transition: transform 0.2s; }
        .wa-float:active { transform: scale(0.9); }

        /* --- DOWNLOAD ANIM --- */
        .dl-wrap { margin-bottom: 15px; position: relative; }
        .anim-btn { position: relative; width: 100%; padding: 16px; font-size: 16px; font-weight: 700; color: white; border: none; border-radius: 30px; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-s { background: #263238; }
        .btn-t { background: #c62828; }
        .prog-bar { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: var(--success); z-index: 1; transition: width 0.1s linear; }
        .btn-txt { position: relative; z-index: 2; display: flex; gap: 10px; align-items: center; }

        /* --- LIST ITEMS --- */
        .q-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 12px; border-left: 5px solid var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; justify-content: space-between; }
        .q-txt-div { width: 75%; font-size: 14px; font-weight: 500; color: #333; }

        /* --- PRINT STYLES (100% FIXED) --- */
        @media print {
            .app-header, .bottom-nav, .tab-section, .modal-overlay, .wa-float, #splash, body > *:not(#print-area) { display: none !important; }
            body, html { background: white; margin: 0; padding: 0; width: 100%; height: 100%; overflow: visible; }
            #print-area { display: block !important; width: 100%; }
            
            @page { size: A4; margin: 0.4cm 0.4cm 1.5cm 0.4cm; } /* Footer Space */

            .print-container { width: 100%; font-family: Arial, sans-serif; color: black; position: relative; }

            /* WATERMARK (FIXED - NO BREAK) */
            .p-watermark {
                position: fixed; 
                top: 50%; left: 50%; 
                transform: translate(-50%, -50%) rotate(-45deg);
                font-size: 60pt; 
                color: rgba(0,0,0,0.08); /* Very Light */
                white-space: nowrap; /* Forces single line */
                pointer-events: none; 
                z-index: -1; 
                font-weight: 900;
                font-family: 'Segoe UI', sans-serif;
                text-transform: uppercase;
                width: 200%; /* Ensure big enough container */
                text-align: center;
            }

            /* HEADER */
            .p-header { text-align: center; border-bottom: 2px solid black; padding-bottom: 5px; margin-bottom: 15px; }
            .p-inst { font-family: 'Times New Roman', serif; font-size: 24pt; font-weight: 900; text-decoration: underline; text-transform: uppercase; line-height: 1.1; margin: 0; color: #000; }
            .p-sub { font-size: 10pt; font-style: italic; margin-top: 4px; }
            .p-exam { font-size: 14pt; font-weight: 800; text-decoration: underline; margin: 8px 0; }
            .p-meta { display: flex; justify-content: space-between; font-size: 10pt; font-weight: 700; width: 100%; margin-top: 5px; }
            .p-right { text-align: right; }

            /* STUDENT & CHAPTER ROW */
            .p-chap-row { text-align: center; font-size: 11pt; font-weight: bold; margin: 5px 0; border: 1px solid #000; padding: 3px; background: #f5f5f5 !important; -webkit-print-color-adjust: exact; }
            .p-std-row { display: flex; flex-wrap: wrap; justify-content: space-between; font-size: 11pt; font-weight: bold; padding: 5px 0; border-top: 1px dashed #666; border-bottom: 1px dashed #666; margin-bottom: 10px; gap: 15px; }

            /* QUESTIONS */
            .sec-h { text-align: center; font-size: 12pt; font-weight: 600; margin: 15px 0 5px 0; text-decoration: underline; }
            .q-box { margin-bottom: 6pt; page-break-inside: avoid; font-size: 11pt; }
            .q-txt { font-weight: 700; display: block; margin-bottom: 3px; text-align: justify; line-height: 1.2; }
            
            .opt-grid { display: grid; grid-template-columns: 25% 25% 25% 25%; width: 100%; font-size: 11pt; font-weight: normal; }
            .opt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 2px; }
            
            .tick { font-family: "Segoe UI Symbol"; font-weight: bold; font-size: 12pt; }
            .ans-panel { background: #eee !important; padding: 2px 5px; font-size: 10pt; font-style: italic; border-left: 3px solid #000; margin-top: 2px; -webkit-print-color-adjust: exact; }

            /* FOOTER */
            .p-footer { 
                position: fixed; bottom: 0; left: 0; right: 0; 
                border-top: 2px solid #000; padding: 5px 0.4cm; 
                background: white; display: flex; justify-content: space-between; 
                font-family: 'Times New Roman', serif; font-weight: bold; font-size: 10pt;
                z-index: 999; height: 25px;
            }
        }
        #print-area { display: none; }
    </style>
</head>

    <script>
        // --- CORE DATA & INIT ---
        let db = { m:[], s:[], l:[] };
        let hist = [];
        let audioCtx;

        window.onload = () => {
            if(localStorage.getItem('ev21_db')) db = JSON.parse(localStorage.getItem('ev21_db'));
            if(localStorage.getItem('ev21_hi')) hist = JSON.parse(localStorage.getItem('ev21_hi'));
            
            initSplash();
            refresh();
            renderHist(hist);
            setupHaptic();
        };

        // --- SPLASH SCREEN & SOUND ---
        function initSplash() {
            const v = localStorage.getItem('ev21_visit');
            const txt = document.getElementById('splashText');
            
            if(!v) {
                txt.innerText = "WELCOME";
                playTone('intro');
                localStorage.setItem('ev21_visit', '1');
            } else {
                txt.innerText = "WELCOME BACK";
                setTimeout(()=>playTone('back'), 500);
            }
            
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').style.display='none', 800);
            }, 2000);
        }

        // Generate Tones (No External Files)
        function playTone(type) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if(type === 'intro') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'back') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'water') {
                // Scroll sound
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300 + Math.random()*200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        // --- HAPTIC & RIPPLE ---
        function setupHaptic() {
            document.addEventListener('click', (e) => {
                if(navigator.vibrate) navigator.vibrate(15); // Haptic
                createRipple(e);
            });
        }

        function createRipple(e) {
            const r = document.createElement('div');
            r.className = 'ripple';
            r.style.left = e.clientX + 'px';
            r.style.top = e.clientY + 'px';
            document.body.appendChild(r);
            setTimeout(() => r.remove(), 600);
        }

        let lastScroll = 0;
        function playScrollSound() {
            const now = Date.now();
            if(now - lastScroll > 150) { // Throttle sound
                playTone('water');
                lastScroll = now;
            }
        }

        // --- DATA MANAGEMENT ---
        function save() { localStorage.setItem('ev21_db', JSON.stringify(db)); refresh(); }
        function saveHi() { localStorage.setItem('ev21_hi', JSON.stringify(hist)); renderHist(hist); }

        function refresh() {
            document.getElementById('cM').innerText = db.m.length;
            document.getElementById('cS').innerText = db.s.length;
            document.getElementById('cL').innerText = db.l.length;
            
            const makeHTML = (arr, type) => arr.map((x, i) => `
                <div class="q-item">
                    <div class="q-txt-div"><b>${type}${i+1}.</b> ${x.q.substring(0,60)}${x.q.length>60?'...':''}</div>
                    <div>
                        <button class="icon-btn" style="background:#fff3e0" onclick="edit('${type}',${i})">✏️</button>
                        <button class="icon-btn" style="background:#ffebee" onclick="del('${type}',${i})">🗑️</button>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('qListContainer').innerHTML = makeHTML(db.m, 'Q') + makeHTML(db.s, 'S') + makeHTML(db.l, 'L');
            document.getElementById('noData').style.display = (db.m.length+db.s.length+db.l.length)?'none':'block';
        }

        // --- IMPORT LOGIC (FIXED COUNT) ---
        function getTemp(t) {
            let arr = [];
            // FIXED LOOP: Exactly 10 items
            for(let i=1; i<=10; i++) {
                if(t==='mcq') arr.push({question:`Sample Question ${i}?`, options:{A:"Opt A",B:"Opt B",C:"Opt C",D:"Opt D"}, correct:"A"});
                else arr.push({type:t, question:`Sample ${t.toUpperCase()} Question ${i}?`, model_answer:`Answer ${i}...`, marks: t==='short'?2:5});
            }
            document.getElementById('txtTemp').value = JSON.stringify(arr, null, 2);
            document.getElementById('modTemp').style.display='flex';
        }

        function runImport() {
            try {
                let box = document.getElementById('jsonIn');
                let j = JSON.parse(box.value);
                if(!Array.isArray(j)) j=[j];
                
                let countM=0, countS=0, countL=0;
                
                j.forEach(x => {
                    let ans = x.model_answer; if(typeof ans === 'object') ans = JSON.stringify(ans);
                    if(x.options) { 
                        let o=x.options; if(!Array.isArray(o)) o=[o.A,o.B,o.C,o.D]; 
                        db.m.push({q:x.question,o:o,a:x.correct}); countM++;
                    } else { 
                        let isL=x.type&&x.type.includes('long'); 
                        db[isL?'l':'s'].push({q:x.question,m:x.marks||2,a:ans});
                        isL ? countL++ : countS++;
                    }
                });
                save();
                box.value = ''; // Clear Box
                alert(`Success!\nAdded:\n• ${countM} MCQs\n• ${countS} Short Questions\n• ${countL} Long Questions`);
            } catch(e) { alert('Invalid JSON Format'); }
        }

        // --- PDF GENERATION (FIXED WATERMARK) ---
        function generatePDF(dataObj, cfg, isT) {
            const P = document.getElementById('print-area');
            P.innerHTML = ''; 
            let con = document.createElement('div');
            con.className = 'print-container';

            if(cfg.vWater) { con.innerHTML += `<div class="p-watermark">${cfg.vWater}</div>`; }

            // Header
            let html = `
                <div class="p-header">
                    <div class="p-inst">${cfg.inst}</div>
                    <div class="p-sub">${cfg.addr}</div>
                    <div class="p-exam">${cfg.exam} ${isT ? '(KEY)' : ''}</div>
                    <div class="p-meta">
                        <div>Class: ${cfg.cls}<br>Sub: ${cfg.sub}</div>
                        <div class="p-right">FM: ${cfg.marks} | Date: ${cfg.date}<br>Time: ${cfg.time} | Q: ${cfg.tot}</div>
                    </div>
                </div>
            `;

            if(cfg.showCh && cfg.vChap) html += `<div class="p-chap-row">Chapter: ${cfg.vChap}</div>`;

            let stdInfo = [];
            if(cfg.showNm) stdInfo.push(`Name: ${cfg.vNm || '...........................'}`);
            if(cfg.showRl) stdInfo.push(`Roll: ${cfg.vRl || '........'}`);
            if(cfg.showFt) stdInfo.push(`Father: ${cfg.vFt || '...........................'}`);
            if(cfg.showSt) stdInfo.push(`Set: ${cfg.vSt || '...'}`);
            if(stdInfo.length) html += `<div class="p-std-row">${stdInfo.map(s => `<span>${s}</span>`).join('')}</div>`;

            // Questions
            if(dataObj.m.length) {
                html += `<div class="sec-h">Section - A (Objective)</div>`;
                dataObj.m.forEach((q, i) => {
                    let opts = '';
                    q.o.forEach((txt, idx) => {
                        let lbl = ['(A)','(B)','(C)','(D)'][idx];
                        let isCorrect = (q.a === ['A','B','C','D'][idx]);
                        let style = (isT && isCorrect) ? 'font-weight:bold;' : '';
                        let check = (isT && isCorrect) ? '<span class="tick"> ✔</span>' : '';
                        opts += `<div class="opt" style="${style}">${lbl} ${txt}${check}</div>`;
                    });
                    html += `<div class="q-box"><span class="q-txt">${i+1}. ${q.q}</span><div class="opt-grid">${opts}</div></div>`;
                });
            }

            const renderWrit = (arr, title) => {
                if(arr.length) {
                    html += `<div class="sec-h">${title}</div>`;
                    arr.forEach((q, i) => {
                        html += `<div class="q-box"><span class="q-txt">${i+1}. ${q.q} <span style="float:right">[${q.m}]</span></span>`;
                        if(isT) html += `<div class="ans-panel"><b>Ans:</b> ${q.a}</div>`;
                        html += `</div>`;
                    });
                }
            };
            renderWrit(dataObj.s, 'Section - B (Short Answer)');
            renderWrit(dataObj.l, 'Section - C (Long Answer)');

            // Footer
            html += `<div class="p-footer"><span>By:- ${cfg.teach}</span><span></span></div>`;

            con.innerHTML += html;
            P.appendChild(con);
            smartPrint();
        }

        // --- UTILS & NAVIGATION ---
        function goTab(id, btn) {
            document.querySelectorAll('.tab-section').forEach(x => x.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            btn.classList.add('active');
            if(id === 'tab-history') { 
                hist = JSON.parse(localStorage.getItem('ev21_hi') || '[]'); 
                renderHist(hist); 
            }
        }

        function getFilename(c) {
            let name = c.sub; 
            if(c.showSt && c.vSt) name += "_" + c.vSt; 
            if(c.showNm && c.vNm) name += "_" + c.vNm.replace(/\s+/g,''); 
            name += "_" + c.date; 
            name += "_" + c.exam.replace(/\s+/g,'').substring(0,10);
            let count = parseInt(localStorage.getItem('ev21_count') || "0") + 1;
            localStorage.setItem('ev21_count', count);
            name += "_" + count;
            if(c.showCh && c.vChap) name += "_" + c.vChap.replace(/\s+/g,'');
            return name;
        }

        function getConfig() {
            return {
                inst: document.getElementById('inst').value,
                addr: document.getElementById('addr').value,
                exam: document.getElementById('exam').value,
                cls: document.getElementById('cls').value,
                sub: document.getElementById('sub').value,
                time: document.getElementById('time').value,
                marks: document.getElementById('marks').value,
                tot: document.getElementById('tot').value,
                date: document.getElementById('date').value,
                teach: document.getElementById('teach').value,
                vWater: document.getElementById('wMark').value,
                showNm: document.getElementById('ckNm').checked,
                showRl: document.getElementById('ckRl').checked,
                showFt: document.getElementById('ckFt').checked,
                showSt: document.getElementById('ckSt').checked,
                showCh: document.getElementById('ckCh').checked,
                vNm: document.getElementById('vNm').value,
                vRl: document.getElementById('vRl').value,
                vFt: document.getElementById('vFt').value,
                vSt: document.getElementById('vSt').value,
                vChap: document.getElementById('chap').value
            };
        }

        function startDL(mode) {
            let btn = document.getElementById(mode==='student'?'btnS':'btnT');
            let bar = document.getElementById(mode==='student'?'pbS':'pbT');
            if(btn.classList.contains('l')) return;
            btn.classList.add('l');
            let w=0;
            let tm = setInterval(() => {
                if(w>=100) {
                    clearInterval(tm);
                    let conf = getConfig();
                    let snap = JSON.parse(JSON.stringify(db));
                    let fname = getFilename(conf);
                    
                    hist.unshift({ fname: fname, date: new Date().toLocaleString(), mode: mode==='student'?'Student':'Teacher Key', data: snap, conf: conf });
                    saveHi();

                    document.title = fname; 
                    generatePDF(snap, conf, mode==='teacher');
                    
                    setTimeout(()=>{ btn.classList.remove('l'); bar.style.width='0%'; }, 2000);
                } else { w+=10; bar.style.width=w+'%'; }
            }, 50);
        }

        function renderHist(list) {
            const hC = document.getElementById('histList');
            if(!list || list.length === 0) { hC.innerHTML=''; document.getElementById('noHist').style.display='block'; return; }
            document.getElementById('noHist').style.display='none';
            
            hC.innerHTML = list.map((x, i) => `
                <div class="hist-item">
                    <div class="hist-left">
                        <div class="marquee-wrap"><span class="marquee-text">${x.fname}</span></div>
                        <div class="hist-meta">${x.date} • ${x.mode}</div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-icon-sm" style="background:#e3f2fd; color:#1565c0" onclick="replayHist(${hist.indexOf(x)})"><i class="fas fa-download"></i></button>
                        <button class="btn-icon-sm" style="background:#ffebee; color:#c62828" onclick="delHist(${hist.indexOf(x)})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function doCopy() { document.getElementById('txtTemp').select(); document.execCommand('copy'); alert('Copied to Clipboard!'); }
        function closeMod(id) { document.getElementById(id).style.display='none'; }
        function del(t, i) { if(confirm('Delete?')) { (t==='Q'?db.m:(t==='S'?db.s:db.l)).splice(i,1); save(); } }
        function edit(t, i) {
            let d = t==='Q'?db.m[i]:(t==='S'?db.s[i]:db.l[i]);
            document.getElementById('eIdx').value = i; document.getElementById('eTyp').value = t;
            document.getElementById('eQ').value = d.q;
            if(t==='Q') {
                document.getElementById('boxOpt').classList.remove('hidden'); document.getElementById('boxWrt').classList.add('hidden');
                ['A','B','C','D'].forEach((k, idx) => document.getElementById('o'+k).value = d.o[idx]);
                document.getElementById('eAns').value = d.a;
            } else {
                document.getElementById('boxOpt').classList.add('hidden'); document.getElementById('boxWrt').classList.remove('hidden');
                document.getElementById('eMans').value = d.a; document.getElementById('eMrk').value = d.m;
            }
            document.getElementById('modEdit').style.display='flex';
        }
        function saveEd() {
            let i=document.getElementById('eIdx').value, t=document.getElementById('eTyp').value, q=document.getElementById('eQ').value;
            if(t==='Q') { db.m[i]={q:q, o:['A','B','C','D'].map(k=>document.getElementById('o'+k).value), a:document.getElementById('eAns').value}; }
            else { db[t==='S'?'s':'l'][i]={q:q, m:document.getElementById('eMrk').value, a:document.getElementById('eMans').value}; }
            save(); closeMod('modEdit');
        }
        function filterHist() { let term = document.getElementById('histSearch').value.toLowerCase(); renderHist(hist.filter(h => h.fname.toLowerCase().includes(term))); }
        function delHist(i) { hist.splice(i,1); saveHi(); }
        function clearHist() { if(confirm('Delete All History?')) { hist=[]; saveHi(); } }
        function replayHist(i) { let h = hist[i]; generatePDF(h.data, h.conf, h.mode === 'Teacher Key'); }
        function resetAll() { if(confirm('Factory Reset?')) { localStorage.clear(); location.reload(); } }
        // ✅ यह नया फंक्शन जोड़ें
        function smartPrint() {
        if (typeof Android !== 'undefined' && Android.printPage) {
        Android.printPage(); // ऐप   } else {
        window.print(); // लिंक/क्रोम के   } }

    </script>
